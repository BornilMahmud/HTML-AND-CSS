<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <script>
    var appCodeName = navigator.appCodeName;
    var appName = navigator.appName;
    var appvirsion = navigator.appVersion;
    var cookieEnable = navigator.cookieEnable;
    var language = navigator.language;
    var userAgent = navigator.userAgent;
    var plartform = navigator.plartform;

    document.write( appCodeName+"<br>");
    document.write( appName+"<br>");
    document.write( appvirsion+"<br>");
    document.write( cookieEnable+"<br>");
    document.write( language+"<br>");
    document.write(userAgent +"<br>");
    document.write(plartform +"<br>");
    
  </script>
</body>
</html>
